name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test-build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # No Firebase project is needed to compile; without config the app shows its setup message.
      - run: flutter build web --release
